<!doctype html>
<html lang="ko">
<head>
<meta name="google-site-verification" content="uYTYs-zZ-hPp_nONa6pfzCWqMgQiUeHwAB0GgfomViQ" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>언제봐?</title>
<meta name="description" content="되는 날에 스티커만 붙이면, 다 같이 되는 날이 바로 보여요.">
<meta property="og:title" content="언제봐?">
<meta property="og:description" content="가능한 시간에 스티커만 붙여주세요">
<meta property="og:image" content="https://pickatime-phi.vercel.app/assets/share-thumbnail-v7.jpg">
<meta property="og:image:width" content="1734">
<meta property="og:image:height" content="907">
<meta name="theme-color" content="#F3F4FF">
<link rel="icon" type="image/png" href="./assets/sticker-eyes.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4FF; --card:#FFFFFF; --ink:#20234C; --sub:#646987; --line:#DFE2F4;
  --s1:#4D50BA; --s2:#9098D5; --s3:#CDD2F2; --gold:#FFD23F; --sun:#E5484D; --sat:#5665BD; --miss:#E8EBF7;
  --display:"Jua","Pretendard",system-ui,sans-serif;
  --body:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:var(--body);color:var(--ink);min-height:100vh;
  background-color:var(--paper);
  background-image:radial-gradient(ellipse at 8% 0%,#E0E5FC 0,transparent 48%),radial-gradient(ellipse at 100% 24%,#EBEAFE 0,transparent 45%),linear-gradient(160deg,#F8F9FF,#EFF1FC);
  background-attachment:fixed;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 80px}
h1,h2,.display{font-family:var(--display);font-weight:400;letter-spacing:-.01em}
.brand{display:inline-flex;align-items:center;line-height:1;text-decoration:none;flex:none}
.brand img{display:block;width:158px;max-width:100%;height:auto;object-fit:contain}
.brand--hero{display:flex;margin:0 0 2px;width:clamp(180px,60vw,250px);max-width:100%}
.brand--hero img{width:100%;height:auto}

.btn.home-meetings{margin-top:16px;background:#E3DFF5;color:#484177}
.hero h1{font-size:40px;line-height:1.15;margin:18px 0 10px}
.hero p{color:var(--sub);margin:0 0 22px;line-height:1.6}
.hero{container-type:inline-size}
.hero h1.home-headline{white-space:nowrap;font-size:clamp(16px,6.7vw,40px);font-size:clamp(16px,7.6cqw,40px)}
.meeting-mark{display:block;width:100%;height:100%;pointer-events:none}
.eye-sticker{background-image:url('./assets/sticker-eyes.png');background-repeat:no-repeat;background-size:120% auto;background-position:center 65%}
.eye-sticker.level-2{background-image:url('./assets/sticker-eyes.png')}
.eye-sticker.level-3{background-image:url('./assets/sticker-question.png')}

.half[data-l="2"] .eye-sticker{background-image:url('./assets/sticker-eyes.png')}
.half[data-l="3"] .eye-sticker{background-image:url('./assets/sticker-question.png')}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
label.f{display:block;font-weight:700;font-size:14px;margin:0 0 8px}
.count-error{font-size:12px;color:var(--sun);margin:6px 0 0;line-height:1.5}
.hint{font-size:13px;color:var(--sub);margin:6px 0 0;line-height:1.5}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;background:#fff}
.inp:focus{border-color:var(--s1);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;background:var(--ink);color:#fff}
.btn.block{width:100%}
.btn.blue{background:var(--s1)}
.btn.ghost{background:transparent;color:var(--sub);padding:8px 10px;font-weight:600;font-size:14px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}

/* Small branded walker for data-loading states. */
.loading-indicator{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px 16px;color:var(--sub);text-align:center}
.loading-label{margin:0;font-size:14px;line-height:1.5}
.loading-walker{position:relative;display:block;width:88px;height:84px;flex:none;overflow:visible}
.walker-shadow{position:absolute;left:18px;bottom:3px;width:52px;height:7px;border-radius:50%;background:rgba(77,80,186,.12);animation:walker-shadow .68s ease-in-out infinite}
.walker-body{position:absolute;inset:0;overflow:visible;animation:walker-sway 1.36s ease-in-out infinite}
.walker-eyes{position:absolute;z-index:2;left:8px;top:0;width:72px;height:72px;background-image:url('./assets/loading-eyes.png');background-repeat:no-repeat;background-size:contain;background-position:center;animation:walker-bob .68s ease-in-out infinite}
.walker-leg{position:absolute;z-index:1;top:52px;width:22px;height:27px;overflow:visible;transform-origin:10px 2px;animation:walker-step .68s ease-in-out infinite}
.walker-leg.left{left:23px}.walker-leg.right{left:45px;animation-delay:-.34s}
@keyframes walker-step{0%,100%{transform:rotate(23deg) translateY(-1px)}50%{transform:rotate(-23deg) translateY(-2px)}}
@keyframes walker-bob{0%,50%,100%{transform:translateY(0) rotate(-1deg)}25%,75%{transform:translateY(-3px) rotate(1deg)}}
@keyframes walker-sway{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
@keyframes walker-shadow{0%,50%,100%{transform:scaleX(1);opacity:.8}25%,75%{transform:scaleX(.88);opacity:.55}}
@media(prefers-reduced-motion:reduce){.loading-walker,.loading-walker *{animation:none!important}.walker-leg.left{transform:rotate(10deg)}.walker-leg.right{transform:rotate(-10deg)}}

/* month picker */
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mo{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 0;font-weight:600;font-size:14px;line-height:1.2}
.mo small{display:block;font-size:10px;color:var(--sub);font-weight:500}
.mo.in{background:var(--s3);border-color:var(--s3)}
.mo.edge{background:var(--s1);border-color:var(--s1);color:#fff}
.mo.edge small{color:#EEE8FA}

/* entry */
.join-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.join-row .inp{min-width:0}
.join-row .btn{white-space:nowrap;padding:13px 16px}
.account-switch{display:flex;justify-content:center;margin:28px 0 0}
.who{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px 6px 6px;font-weight:600}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex:none}

/* session header */
.top{display:flex;justify-content:space-between;align-items:center}
.meeting-title-row{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.meeting-title-row .stitle{margin:0;min-width:0;overflow-wrap:anywhere}
.edit-meeting-title{display:grid;place-items:center;flex:none;width:32px;height:36px;padding:5px;border:0;border-radius:8px;background:transparent;color:var(--sub);cursor:pointer}
.edit-meeting-title svg{width:18px;height:18px}.edit-meeting-title:hover{background:#E9EBFA;color:var(--s1)}
.stitle{font-size:30px;line-height:1.2;margin:14px 0 4px;word-break:keep-all}
.speriod{color:var(--sub);font-size:14px;margin:0 0 14px}
.meeting-period-row{display:flex;align-items:center;gap:6px;margin:0 0 14px}
.meeting-period-row .speriod{margin:0;min-width:0;overflow-wrap:anywhere}
.edit-meeting-period{width:30px;height:30px}
.period-editor .dialog-heading{margin-bottom:14px}
.period-editor [hidden]{display:none!important}
.period-editor input{min-width:0}
.period-preserve-note{margin-top:16px}
.mebar{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px;margin-bottom:12px;font-size:14px}
.mebar[hidden]{display:none}
.mebar b{font-weight:700}
.attendance{padding:16px;margin-bottom:14px;background:#fff;border:1.5px solid var(--line);border-radius:18px}
.attendance-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.attendance-count{font-size:17px;font-weight:700}.attendance-count b{font-size:23px;color:var(--s1)}
.invite-btn{font-size:13px;padding:10px 12px;border-radius:11px}
.share-icon{width:21px;height:21px;flex:none}.icon-btn{width:44px;height:44px;padding:10px!important}
.member-stickers{display:flex;flex-wrap:wrap;gap:7px}
.name-sticker{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:11px;background:var(--member-bg);border:1.5px solid var(--member-color);color:var(--ink);font-weight:700;font-size:13px;box-shadow:0 2px 0 #14213D0A;max-width:100%;overflow-wrap:anywhere}
.name-sticker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--member-color);flex:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#E2E5F7;border-radius:14px;padding:4px;margin-bottom:14px;position:sticky;top:8px;z-index:5}
.tab{border:0;background:transparent;border-radius:11px;padding:11px 0;font-weight:700;color:var(--sub);font-size:15px}
.tab[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#23C16B;margin-left:6px;vertical-align:middle;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.demo{background:#FFF4C2;border:1.5px dashed #E8C640;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;line-height:1.5}

.period-switch{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;padding:6px;margin:0 0 20px;background:#E9EBFA;border:1.5px solid #CDD2F2;border-radius:18px}
.period-option{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;min-height:78px;padding:12px 6px;border:1.5px solid transparent;border-radius:12px;background:transparent;color:var(--sub);cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.period-option-title{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:16px;font-weight:800;white-space:nowrap}
.period-option-title svg{width:20px;height:20px;flex:none}
.period-option-detail{font-size:12px;line-height:1.4}
.period-option[aria-pressed="true"]{background:var(--s1);color:#fff;border-color:#3F42A5;box-shadow:0 3px 8px rgba(77,80,186,.2)}
.period-option[aria-pressed="false"]:hover{background:#F8F9FF;color:var(--s1)}
.period-option:focus-visible{outline:3px solid var(--s1);outline-offset:3px}
@media(prefers-reduced-motion:reduce){.period-option{transition:none}}
.date-range-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.date-range-fields>div,.date-range-fields input{min-width:0;width:100%}
.date-range-fields input{font-size:16px;padding:12px 8px;box-sizing:border-box}
@media(max-width:350px){.date-range-fields{grid-template-columns:1fr}}
/* legend */
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;font-size:13px;color:var(--sub);margin:2px 2px 12px}
.legend>span{display:flex;align-items:center;gap:6px;min-width:0;line-height:1.5}
.legend>span:last-child{grid-column:1 / -1}
.legend-sticker{display:inline-flex;width:30px;height:29px;flex:none;padding:0;background:transparent}
.legend-sticker.l1{color:var(--s1)}.legend-sticker.l2{color:var(--s2)}.legend-sticker.l3{color:var(--s3)}
.legend-sticker .eye-sticker{opacity:1}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}

/* calendar */
.month{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:14px 10px 10px;margin-bottom:14px}
.month h2{font-size:22px;margin:0 6px 10px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.wk div{text-align:center;font-size:12px;font-weight:600;color:var(--sub);padding-bottom:6px}
.wk div:first-child,.day.sun .n{color:var(--sun)}
.wk div:last-child,.day.sat .n{color:var(--sat)}
.day.holiday .n{color:var(--sun)}
.day.today.holiday .n{background:var(--sun);color:white}
.half{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.day{display:flex;flex-direction:column;gap:3px;padding:3px 2px;min-width:0}
.day .n{text-align:center;font-size:13px;font-weight:700;line-height:1.2;position:relative}
.day.past .n{color:#C3CBDA!important;font-weight:500}
.day.today .n{background:var(--ink);color:#fff!important;border-radius:99px;margin:0 auto;padding:0 7px}
.half{position:relative;border:0;padding:0;height:48px;border-radius:11px;background:var(--vote-bg,#EFF1FA);display:grid;place-items:center;overflow:visible}
.half:disabled{background:transparent;cursor:default}
.half:disabled .lb{opacity:0}
.half .lb{position:relative;z-index:2;font-size:10px;font-weight:600;color:#14132B;white-space:nowrap}
.half[data-l]:not([data-l="0"]) .lb{display:none}
.stk{position:absolute;z-index:1;inset:0;border:0;padding:1px 3px;background:transparent;
  box-shadow:none;
  transform:rotate(var(--r)) scale(0);transition:transform .22s cubic-bezier(.3,1.6,.5,1),color .15s}

.half[data-l="2"] .stk{color:var(--s1);transform:rotate(var(--r)) scale(1)}
.half[data-l="3"] .stk{color:var(--s2);transform:rotate(var(--r)) scale(1)}
.half[data-l="4"] .stk{transform:rotate(var(--r)) scale(1)}
.eye-sticker{position:relative}
 .eye-sticker.level-4,.half[data-l="4"] .eye-sticker{background-image:url('./assets/sticker-unavailable.svg')}

.half .eye-sticker{opacity:1}
@media(prefers-reduced-motion:reduce){.stk{transition:none}}
.half.busy::before{content:"";position:absolute;z-index:3;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px #fff}
.calbar{margin-bottom:12px}
.calbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px dashed #AEBBD3;background:#fff;border-radius:14px;padding:12px 14px;text-align:left}
.calbtn .ic{flex:none;width:34px;height:34px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-size:18px}
.calbtn .tx{flex:1;min-width:0}
.calbtn b{display:block;font-size:15px}
.calbtn small{display:block;color:var(--sub);font-size:12px;margin-top:1px}
.calbtn .go{color:var(--sub);font-weight:700;font-size:12px;text-align:right;word-break:keep-all}
.calbtn.on{border-style:solid}
.sheet .opt{margin-top:8px}
.btn.line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.calbar b{font-weight:700}
.calbar .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sbtn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:600}
.sbtn.link{border:0;padding:7px 4px;color:var(--sub);text-decoration:underline}
.calhelp{margin-top:8px;padding:10px;background:var(--paper);border-radius:10px;color:var(--sub)}
.wkplan{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;border:0;background:#F4F6FA;border-radius:8px;padding:4px 2px;margin:-3px 0 0;text-align:left;width:100%}
.wp-col{display:flex;flex-direction:column;gap:2px;min-width:0}
.ev{display:block;font-size:9.5px;line-height:1.4;padding:0 2px 0 3px;border-radius:3px;background:#E3E7EF;color:#4A5570;white-space:nowrap;overflow:hidden;border-left:2px solid #A9B3C6}
.ev.l{border-left-color:#E0A800}.ev.d{border-left-color:#3340A0}.ev.a{background:#D3D9E5;border-left-color:#5B6782}
.ev.more{background:transparent;border:0;color:var(--sub);font-weight:600}
.wkdetail{grid-column:1/-1;background:#F4F6FA;border-radius:8px;padding:6px 10px 8px;font-size:12.5px;line-height:1.75;color:var(--ink)}
.wkdetail .tm{color:var(--sub);margin-right:4px}
.slot{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.slot.L{background:#FFF1C9;color:#8A6300}.slot.D{background:#E3E8FF;color:#3340A0}
.clear{display:block;margin:4px auto 0}
.vote-save-status{display:flex;justify-content:flex-end;font-size:13px;color:var(--sub);margin:8px 0 14px;text-align:right;min-height:32px}
.vote-save-status>span{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid transparent;border-radius:999px;line-height:20px}
.vote-save-status.is-saved>span{color:#187447;background:#E7F6ED;border-color:#BCE4CC;font-weight:700}
.vote-save-status.save-error{color:var(--sun)}
#retryVoteSave{display:block;margin:-6px 0 14px auto;color:var(--sun)}
#retryVoteSave[hidden]{display:none}

/* ranking */
.vote-results-ready{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-size:13px;color:var(--s1)}
.sum{font-family:var(--display);font-size:22px;line-height:1.35;margin:4px 2px 12px;word-break:keep-all}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.rank-color-key{margin:0 2px 14px;font-size:12px}
.pp{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:600}
.pp .av{width:22px;height:22px;font-size:11px}
.pp em{font-style:normal;color:var(--sub);font-weight:500}
.pp.wait{border-style:dashed;color:var(--sub)}
.rank{list-style:none;margin:0;padding:0}
.rk{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.rk.all{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.pos{font-family:var(--display);font-size:22px;text-align:center;color:var(--sub)}
.rk:nth-child(-n+3) .pos{color:var(--ink)}
.rdate{font-weight:700;font-size:16px}
.rdate small{font-weight:600;color:var(--sub);margin-left:4px}
.rdate small.sun{color:var(--sun)} .rdate small.sat{color:var(--sat)}
.bar{display:flex;gap:2px;height:10px;margin:7px 0 6px;border-radius:99px;overflow:hidden}
.bar i{flex:1;min-width:0;position:relative}
.people .pp{border-color:var(--member-color,var(--line))}
.bar .b2,.bar .b4{background:var(--member-color,var(--s1))}
.bar .b3{background:repeating-linear-gradient(135deg,var(--member-color,var(--s2)) 0 3px,#FFFFFFBB 3px 6px)}
.bar .b4::after{content:'×';position:absolute;inset:0;text-align:center;font-size:11px;line-height:10px;font-style:normal;font-weight:800;color:#fff}
.b2{background:var(--s1)}.b3{background:var(--s2)}.b4{background:#D74650}.b0{background:var(--miss)}
.missing{font-size:12px;color:var(--sub);line-height:1.4}
.cnt{font-family:var(--display);font-size:22px;text-align:right;white-space:nowrap}
.cnt small{font-family:var(--body);font-size:12px;color:var(--sub);font-weight:600}
.allstk{display:inline-block;font-family:var(--display);font-size:15px;line-height:1.1;text-align:center;background:var(--gold);color:var(--ink);
  padding:9px 10px;border:3px solid #fff;border-radius:14px;transform:rotate(-7deg);box-shadow:0 2px 0 rgba(20,33,61,.18)}
.empty{text-align:center;color:var(--sub);padding:30px 10px;line-height:1.7}
.more{width:100%;margin-top:4px}

/* toast & sheet */
.toast{white-space:pre-line;position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:.2s;pointer-events:none;z-index:30;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;background:rgba(20,33,61,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}

/* ---------- 안전한 브라우저 저장소 ---------- */
const mem={};
const safe=k=>({
  get:key=>{try{return window[k].getItem(key)}catch(e){return mem[k+key]??null}},
  set:(key,v)=>{try{window[k].setItem(key,v)}catch(e){mem[k+key]=v}},
  del:key=>{try{window[k].removeItem(key)}catch(e){delete mem[k+key]}}
});
const LS=safe('localStorage'), SS=safe('sessionStorage');

/* ---------- 저장소 (Firebase / 체험 모드) ---------- */
function makeStore(){
  if (FIREBASE_CONFIG.databaseURL && window.firebase) {
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    return {
      demo:false,
      get:p=>db.ref(p).once('value').then(s=>s.val()),
      set:(p,v)=>db.ref(p).set(v),
      update:(p,v)=>db.ref(p).update(v),
      putVoteIfEmpty:(p,v)=>db.ref(p).transaction(current=>current===null||current===0?v:undefined,undefined,false),
      on:(p,cb)=>{const r=db.ref(p),h=s=>cb(s.val());r.on('value',h,()=>toast('실시간 데이터를 읽지 못했어요. DB 규칙과 연결을 확인해 주세요.'));return()=>r.off('value',h)}
    };
  }
  const KEY='wmd-demo-db', listeners=new Set();
  let bc=null;try{bc=new BroadcastChannel(KEY)}catch(e){}
  const read=()=>{try{return JSON.parse(LS.get(KEY))||{}}catch(e){return{}}};
  const parts=p=>p.split('/').filter(Boolean);
  const getAt=(o,p)=>parts(p).reduce((a,k)=>a==null?null:(a[k]??null),o);
  const fire=()=>listeners.forEach(f=>f());
  if(bc) bc.onmessage=fire;
  return {
    demo:true,
    get:async p=>JSON.parse(JSON.stringify(getAt(read(),p))),
    set:async(p,v)=>{
      const root=read(),ks=parts(p),stack=[];let o=root;
      for(let i=0;i<ks.length-1;i++){if(!o[ks[i]]||typeof o[ks[i]]!=='object')o[ks[i]]={};stack.push([o,ks[i]]);o=o[ks[i]]}
      const last=ks[ks.length-1];
      if(v==null)delete o[last];else o[last]=v;
      for(let i=stack.length-1;i>=0;i--){const[par,k]=stack[i];if(Object.keys(par[k]).length===0)delete par[k];else break}
      LS.set(KEY,JSON.stringify(root));
      bc&&bc.postMessage(1);fire();
    },
    on:(p,cb)=>{const f=()=>cb(JSON.parse(JSON.stringify(getAt(read(),p))));listeners.add(f);f();return()=>listeners.delete(f)}
  };
}
const store = makeStore();
if(!store.update)store.update=async(p,values)=>{
  const current=await store.get(p);if(!current)throw Error('MISSING_MEETING');
  await store.set(p,{...current,...values});
};
if(!store.putVoteIfEmpty)store.putVoteIfEmpty=async(p,v)=>{
  const current=await store.get(p);
  if(current!==null&&current!==undefined&&current!==0)return {committed:false};
  await store.set(p,v);return {committed:true};
};

/* ---------- 계정별 닉네임 · 참여 모임 ---------- */
let myProfile={nickname:'',meetings:{}};
let profileCloudReady=true;
let profileSyncIssue='';
function noteProfileSyncFailure(error){
  profileCloudReady=false;
  const code=String(error?.code||'')+' '+String(error?.message||'');
  profileSyncIssue=/permission[-_ ]denied/i.test(code)
    ?'계정 목록 접근 권한이 없습니다. (PERMISSION_DENIED)'
    :'계정 목록 서버에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.';
}
const validMeetingId=id=>/^[a-zA-Z0-9_-]{1,100}$/.test(id);
function cleanProfile(value){
  const nickname=typeof value?.nickname==='string'?[...value.nickname.trim()].slice(0,10).join(''):'';
  const meetings={};
  for(const [id,joined] of Object.entries(value?.meetings||{}))if(validMeetingId(id)&&joined===true)meetings[id]=true;
  return {nickname,meetings};
}
function cacheMyProfile(){if(kakaoUser)LS.set('wmd:profile:'+kakaoUser.id,JSON.stringify(myProfile))}
async function loadMyProfile(){
  let local;try{local=JSON.parse(LS.get('wmd:profile:'+kakaoUser.id))}catch(e){}
  myProfile=cleanProfile(local);profileCloudReady=Boolean(kakaoUser.profileKey);
  profileSyncIssue=kakaoUser.profileKey?'':'계정 연결 정보를 갱신하려면 다시 로그인해 주세요.';
  // 기존 브라우저에 남아 있는 참여 이력도 새 목록에 포함합니다.
  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(key?.startsWith('wmd:me:')&&localStorage.getItem(key)===kakaoUser.id){const id=key.slice(7);if(validMeetingId(id))myProfile.meetings[id]=true}
    }
  }catch(e){}
  if(kakaoUser.profileKey){
    try{
      const remote=cleanProfile(await store.get('profiles/'+kakaoUser.profileKey));
      const cached=myProfile;
      myProfile={nickname:remote.nickname||cached.nickname,meetings:{...cached.meetings,...remote.meetings}};
      const migration=[];
      if(!remote.nickname&&cached.nickname)migration.push(store.set(`profiles/${kakaoUser.profileKey}/nickname`,cached.nickname));
      for(const id of Object.keys(cached.meetings))if(!remote.meetings[id])migration.push(store.set(`profiles/${kakaoUser.profileKey}/meetings/${id}`,true));
      const migrated=await Promise.allSettled(migration);
      const failed=migrated.find(r=>r.status==='rejected');
      if(failed)noteProfileSyncFailure(failed.reason);
    }catch(e){noteProfileSyncFailure(e)}
  }
  cacheMyProfile();
}
async function saveMyNickname(name){
  myProfile.nickname=name;cacheMyProfile();
  if(!kakaoUser?.profileKey){profileCloudReady=false;return false}
  try{await store.set(`profiles/${kakaoUser.profileKey}/nickname`,name);return true}catch(e){profileCloudReady=false;return false}
}
async function rememberMeeting(id){
  if(!kakaoUser||!validMeetingId(id))return;
  myProfile.meetings[id]=true;cacheMyProfile();
  if(!kakaoUser.profileKey){profileCloudReady=false;return}
  try{await store.set(`profiles/${kakaoUser.profileKey}/meetings/${id}`,true)}catch(e){profileCloudReady=false}
}
async function joinWithNickname(id,name){
  const old=await store.get(`sessions/${id}/members/${kakaoUser.id}`);
  const member={name,joinedAt:old?.joinedAt||Date.now()};
  await store.set(`sessions/${id}/members/${kakaoUser.id}`,member);
  if(myProfile.nickname!==name)await saveMyNickname(name);
  await rememberMeeting(id);
  if(!old)usage('meeting_join');
  return member;
}
async function renameMyNickname(name){
  const previous=myProfile.nickname;
  const saved=await saveMyNickname(name);
  if(kakaoUser?.profileKey&&!saved){myProfile.nickname=previous;cacheMyProfile();throw new Error('PROFILE_SAVE_FAILED')}
  const ids=[...new Set([...Object.keys(myProfile.meetings),sid])].filter(validMeetingId);
  const changed=await Promise.allSettled(ids.map(id=>store.set(`sessions/${id}/members/${kakaoUser.id}/name`,name)));
  if(S.members?.[S.me])S.members={...S.members,[S.me]:{...S.members[S.me],name}};
  return changed.every(r=>r.status==='fulfilled');
}

/* ---------- 유틸 ---------- */
const $ = s=>document.querySelector(s);
const WD = ['일','월','화','수','목','금','토'];
const COLORS = ['#4D50BA','#FF7A59','#16A37B','#9B5DE5','#F2A900','#E5484D','#0EA5C6','#5B6782'];
const pad = n=>String(n).padStart(2,'0');
const ymOf = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const ymdOf = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayStr = ()=>ymdOf(new Date());
const holidayName = date=>window.KR_HOLIDAYS?.[date]||'';
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash = s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const colorOf = name=>COLORS[hash(name)%COLORS.length];
function avatarTextColor(color){
  if(!/^#[0-9a-f]{6}$/i.test(color))return '#fff';
  const rgb=[1,3,5].map(i=>parseInt(color.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);
  const luminance=.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];
  return (luminance+.05)/.07>=1.05/(luminance+.05)?'#20234C':'#fff';
}
const avatar = (name,color=colorOf(name))=>`<span class="av" style="background:${color};color:${avatarTextColor(color)}">${esc([...name][0]||'?')}</span>`;
const MEMBER_COLORS=['#E36D7E','#E69959','#D6B34C','#69AE86','#65A5D3','#7D84CB','#A17BC7','#ED94A1','#EEB785','#E4CA7D','#96C6A9','#93BFDF','#A5AADE','#BEA4DB'];
function sortedMemberIds(members){
  return Object.keys(members||{}).sort((a,b)=>(Number(members[a]?.joinedAt)||0)-(Number(members[b]?.joinedAt)||0)||a.localeCompare(b));
}
function memberColorMap(members){
  const colors={},used=new Set();let extra=0;
  for(const [i,id] of sortedMemberIds(members).entries()){
    let color=MEMBER_COLORS[i];
    while(!color||used.has(color)){
      const step=extra++,hue=([351,28,48,145,204,239,278][step%7]+Math.floor(step/7)*3)%360,light=.44+.035*(Math.floor(step/7)%7),a=.58*Math.min(light,1-light);
      const channel=n=>{const k=(n+hue/30)%12;return Math.round(255*(light-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};
      color='#'+channel(0)+channel(8)+channel(4);
    }
    colors[id]=color;used.add(color);
  }
  return colors;
}

const periodLabel = (a,b)=>{
  if(a.length===10||b.length===10){
    const bounds=window.VoteTransfer.bounds({start:a,end:b});if(!bounds)return '';
    const label=d=>`${monthLabel(d)} ${Number(d.slice(8))}일`;
    return bounds.start===bounds.end?label(bounds.start):`${label(bounds.start)} ~ ${bounds.end.slice(0,4)===bounds.start.slice(0,4)?Number(bounds.end.slice(5,7))+'월 '+Number(bounds.end.slice(8))+'일':label(bounds.end)}`;
  }

async function share(sid,title,options={}){
  const payload=shareContent(sid,title,options),url=payload.url;
  document.querySelector('#shareFallback')?.remove();
  const el=document.createElement('dialog');el.id='shareFallback';el.className='existing-meeting';
  el.setAttribute('aria-labelledby','shareFallbackTitle');
  el.innerHTML=`<div class="dialog-heading"><h2 id="shareFallbackTitle">공유하기</h2><button type="button" class="btn ghost icon-btn dialog-close" data-close aria-label="공유 닫기">✕</button></div>
    <button type="button" class="btn block" style="background:#FEE500;color:#191919;margin-top:18px" data-kakao>카카오톡으로 공유</button>
    <button type="button" class="btn blue block" style="margin-top:10px" data-native>다른 앱으로 공유</button>
    <button type="button" class="btn ghost block" style="margin-top:10px" data-copy>${options.copyMessage?'내용과 링크 복사':'링크 복사'}</button>
    <p class="count-error" data-error role="status" hidden></p>`;
  const close=()=>{el.close();el.remove()};
  const error=el.querySelector('[data-error]');
  const showError=text=>{error.textContent=text;error.hidden=false};
  const controls=[...el.querySelectorAll('[data-kakao],[data-native],[data-copy]')];
  const busy=value=>controls.forEach(b=>b.disabled=value);
  el.querySelector('[data-close]').onclick=close;
  el.addEventListener('cancel',e=>{e.preventDefault();close()});
  el.querySelector('[data-kakao]').onclick=async()=>{
    error.hidden=true;
    if(!canShareToKakao()){showError('카카오톡 공유를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.');return}
    busy(true);
    try{
      // Invoke directly inside this click, before awaiting, to preserve activation.
      usage('share_start',{channel:'kakao',content_type:shareUsageType(options)});
      const request=shareToKakao(sid,title,options);
      await request;usage('share_handoff',{channel:'kakao',content_type:shareUsageType(options)});close();
    }catch(e){showError('카카오톡 공유를 열지 못했어요. 다시 시도해 주세요.')}
    finally{busy(false)}
  };
  el.querySelector('[data-native]').onclick=async()=>{
    error.hidden=true;
    if(typeof navigator.share!=='function'){
      showError('이 브라우저에서는 다른 앱 공유를 지원하지 않아요. Chrome 또는 Safari에서 열거나 링크를 복사해 주세요.');return;
    }
    busy(true);
    try{
      // Keep the whole message in one text field so receiving apps cannot drop the title.
      const message=options.kakaoText||[payload.title,payload.description].join('\n\n');
      const data={text:[message,url].join('\n\n')};
      usage('share_start',{channel:'native',content_type:shareUsageType(options)});
      const request=navigator.share(data);
      await request;usage('share_handoff',{channel:'native',content_type:shareUsageType(options)});close();
    }catch(e){usage(e.name==='AbortError'?'share_cancel':'share_error',{channel:'native',content_type:shareUsageType(options),reason:'failed'});if(e.name!=='AbortError')showError('공유창을 열지 못했어요. 다시 시도하거나 Chrome 또는 Safari에서 열어 주세요.')}
    finally{busy(false)}
  };
  el.querySelector('[data-copy]').onclick=async()=>{
    error.hidden=true;
    try{
      await navigator.clipboard.writeText(payload.copyText);usage('share_handoff',{channel:'copy',content_type:shareUsageType(options)});close();toast(options.copyMessage?'투표 상황과 링크를 복사했어요':'링크를 복사했어요');
    }catch(e){prompt('공유할 내용을 복사해 주세요',payload.copyText)}
  };
  document.body.appendChild(el);el.showModal();
  usage('share_open',{content_type:shareUsageType(options)});
}

async function meetingIdFor(creatorId,title){
  const input=JSON.stringify([creatorId,title.trim().normalize('NFC')]);
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(input));
  return 'm_'+Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
}

function validateMeetingPeriod(range){
  if(!range?.start||!range?.end)return '시작과 종료를 모두 선택해 주세요.';
  const shape=/^[0-9]{4}-(0[1-9]|1[0-2])(?:-[0-9]{2})?$/;
  if(typeof range.start!=='string'||typeof range.end!=='string'||!shape.test(range.start)||!shape.test(range.end)||range.start.length!==range.end.length)return '월 또는 날짜를 올바르게 선택해 주세요.';
  if(range.end<range.start)return '종료일은 시작일과 같거나 이후여야 해요.';
  const count=(Number(range.end.slice(0,4))-Number(range.start.slice(0,4)))*12+Number(range.end.slice(5,7))-Number(range.start.slice(5,7))+1;
  if(count>6)return '최대 6개월까지 고를 수 있어요.';
  if(!window.VoteTransfer.bounds(range))return '존재하는 날짜를 선택해 주세요.';
  return '';
}
function receiveMeetingMeta(meta){
  const changed=S.meta&&(S.meta.start!==meta.start||S.meta.end!==meta.end);

    const hadCalendar=Boolean(personalCalendar());
    closeCalSheet();closeVoteImport();clearCal();
    if(hadCalendar)toast('후보 날짜가 바뀌었어요. 캘린더를 다시 가져와 주세요.');
  }
  S.meta=meta;refresh(Boolean(changed));
}

const S={meta:null,me:null,members:null,votes:{},tab:'mine',showAll:false};

let sessionLoad=0;
async function bootSession(){
  closeMeetingPeriod();

  closeVoteImport();
  stopMeetingStatusWatch();
  detachVoteDrag?.();detachVoteDrag=null;

  }catch(e){
    if(request===sessionLoad){setPageLoading(false);$('#app').innerHTML='<p class="empty">투표를 불러오지 못했어요. 잠시 후 다시 열어 주세요.</p><a class="btn blue block" href="'+esc(shareUrl(id))+'">다시 불러오기</a>';}

    return;
  }
  S.members=data.members||{};S.votes=data.votes||{};
  if(kakaoUser){

    if(request!==sessionLoad)return;

      }catch(e){toast('참여 정보를 저장하지 못했어요. 다시 참여하기를 눌러 주세요.')}
    }
  }

  void registerAdminMeeting(id,S.meta);
  document.title=`${S.meta.title} · 언제봐?`;
  route();
  watchMeetingStatus(id,request);
  S.unsub=[store.on(`sessions/${id}/meta`,v=>{if(request!==sessionLoad)return;if(v)receiveMeetingMeta(v)}),store.on(`sessions/${id}/members`,v=>{
    if(request!==sessionLoad)return;

    route();
  }),store.on(`sessions/${id}/votes`,v=>{if(request!==sessionLoad)return;S.votes=v||{};refresh()})];

function refresh(periodChanged=false){

  const top=best?`${date.getFullYear()}.${pad(date.getMonth()+1)}.${pad(date.getDate())} (${WD[date.getDay()]}) ${SLOT_NAME[best.sl]}${tied>1?' · 공동 1위 '+tied+'개':''}`:'아직 예정된 1위 일시가 없어요';

function rankShareState(data=S,ranked=computeRank(data).list){
  const ids=Object.keys(data.members||{}),voters=new Set();
  for(const id of ids)for(const [date,slots] of Object.entries(data.votes?.[id]||{})){
    if(date<todayStr()||!inMeetingRange(date,data.meta)||!slots||typeof slots!=='object')continue;
    if(['L','D'].some(slot=>normalizeVoteLevel(slots[slot])>0))voters.add(id);
  }
  const expected=Number.isSafeInteger(data.meta?.expectedCount)&&data.meta.expectedCount>=2&&data.meta.expectedCount<=100?data.meta.expectedCount:null;
  const total=Math.max(expected||0,ids.length),voted=voters.size,remaining=expected?Math.max(0,total-voted):null;
  const complete=Boolean(expected&&total>=2&&remaining===0);
  const headline=expected?(complete?'모두 투표에 참여했어요!':remaining+'명만 더 투표하면 돼요!'):voted+'명이 투표에 참여했어요.';
  const dates=[],seen=new Set();
  for(const row of ranked){if(seen.has(row.d))continue;seen.add(row.d);dates.push(row);if(dates.length===5)break}
  const lines=dates.map((row,i)=>{const d=parseYmd(row.d);return (i+1)+'. '+d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' ('+WD[d.getDay()]+') '+SLOT_NAME[row.sl]+' · '+row.count+'/'+total+'명'});
  const description=[headline,'',dates.length?(complete?'상위 '+dates.length+'개 날짜':'유력 날짜'):'아직 유력 날짜가 없어요.',...lines].join('\n');
  return {total,voted,remaining,complete,headline,dates,description};
}
function rankKakaoText(title,status){
  const heading='📅 '+title+(status.complete?' 투표 결과':' 투표 상황');
  const lines=status.dates.map((row,i)=>{
    const d=parseYmd(row.d);
    return (i+1)+'. '+String(d.getFullYear()).slice(-2)+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+'('+WD[d.getDay()]+') '+SLOT_NAME[row.sl]+' '+row.count+'/'+status.total+'명';
  });
  const body=[status.headline,'',lines.length?(status.complete?'상위 '+lines.length+'개 날짜':'유력 날짜'):'아직 유력 날짜가 없어요.',...lines].join('\n');
  // Kakao's text template displays up to 200 characters. Keep every ranked date.
  const budget=200-body.length-2;
  let shortHeading=heading;
  if(shortHeading.length>budget){
    shortHeading='';
    for(const char of heading){if(shortHeading.length+char.length>budget-1)break;shortHeading+=char}
    shortHeading+='…';
  }
  return shortHeading+'\n\n'+body;
}

let voteImportDialog=null,voteImportLoading=null;
const voteImportSeen=new Set();

function voteImportContext(){return {id:sid,user:S.me,request:sessionLoad,start:S.meta?.start,end:S.meta?.end,key:kakaoUser?.profileKey}}
function voteImportActive(c){return sid===c.id&&sessionLoad===c.request&&kakaoUser?.id===c.user&&S.me===c.user&&shown==='main'&&S.tab==='mine'&&S.meta?.start===c.start&&S.meta?.end===c.end}
async function voteImportSource(id,c,current){
  const meta=await store.get(`sessions/${id}/meta`);
  const overlap=window.VoteTransfer.plan(meta,c,{},current,todayStr());
  if(!overlap.start||overlap.start>overlap.end)return null;
  const [deleted,member,votes]=await Promise.all([isMeetingDeleted(id),store.get(`sessions/${id}/members/${c.user}`),store.get(`sessions/${id}/votes/${c.user}`)]);
  if(deleted||!member)return null;
  const plan=window.VoteTransfer.plan(meta,c,votes,current,todayStr());
  return plan.cells.length?{id,meta,plan}:null;
}
async function offerVoteImport(manual=false){
  if(!window.VoteTransfer||!S.me||S.me!==kakaoUser?.id||!S.meta||S.tab!=='mine'||shown!=='main')return;
  const saveState=voteSaves.info(voteSaveKey());if(saveState.pending||saveState.failed)return;
  const c=voteImportContext(),key=[c.user,c.id].join(':'),seenKey='wmd:vote-import-seen:'+key,token=key+':'+c.request;
  if(voteImportDialog||voteImportLoading===token||(!manual&&(voteImportSeen.has(key)||LS.get(seenKey)==='1')))return;
  if(document.querySelector('.sheet,dialog[open]'))return;
  voteImportLoading=token;
  const remember=()=>{voteImportSeen.add(key);LS.set(seenKey,'1')};
  try{
    const meetings={...myProfile.meetings};
    if(c.key){try{Object.assign(meetings,await store.get(`profiles/${c.key}/meetings`)||{})}catch{}}
    if(!voteImportActive(c))return;
    const ids=Object.keys(meetings).filter(id=>meetings[id]===true&&id!==c.id&&validMeetingId(id));
    const sources=[];let next=0,failed=false;
    await Promise.all(Array.from({length:Math.min(4,ids.length)},async()=>{
      while(next<ids.length&&voteImportActive(c)){
        const id=ids[next++];try{const source=await voteImportSource(id,c,myVotes());if(source)sources.push(source)}catch{failed=true}
      }
    }));
    if(!voteImportActive(c))return;

const voteSaves=window.createVoteSaveTracker(()=>renderVoteSaveState());
const voteSaveKey=(id=sid,user=S.me)=>id+':'+user;
function renderVoteSaveState(){

async function retryVoteSaves(){

async function trackedVoteTransaction(c,cell){

/* ----- 내 스티커 달력 ----- */
const LEVEL_TEXT={2:'아마 가능',3:'되긴 하는데…',4:'불가능'};
// Keep stored levels 2/3 stable and use 4 for unavailable; merge old sparkle (1) into normal eyes (2).
const normalizeVoteLevel=level=>level===1?2:level===2||level===3||level===4?level:0;
const nextVoteLevel=level=>Number(level)===2?3:Number(level)===3||Number(level)===4?0:2;
const SLOTS=[['L','점심'],['D','저녁']];
const SLOT_NAME={L:'점심',D:'저녁'};
function myVotes(){return S.votes?.[S.me]||{}}
const lvOf=(v,d,sl)=>(v&&typeof v[d]==='object'&&v[d])?normalizeVoteLevel(v[d][sl]):0;
function calendarVoteTotal(data=S){
  const expected=data.meta?.expectedCount;
  return Math.max(Number.isSafeInteger(expected)&&expected>=2&&expected<=100?expected:0,Object.keys(data.members||{}).length,1);
}
function calendarVoteHeat(data=S){
  const counts={};
  for(const row of computeRank(data).list)counts[row.d+'|'+row.sl]=row.count;
  return {counts,total:calendarVoteTotal(data)};
}
function calendarHeatColor(count,total){
  const t=Math.pow(Math.max(0,Math.min(1,count/Math.max(1,total))),0.8);
  const from=[239,241,250],to=[129,121,202];
  return 'rgb('+from.map((v,i)=>Math.round(v+(to[i]-v)*t)).join(', ')+')';
}
function calendarVoteLabel(date,slot,level,count,total,busy=false){
  const d=parseYmd(date),holiday=holidayName(date);
  return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+WD[d.getDay()]+'요일'+(holiday?', '+holiday:'')+' '+SLOT_NAME[slot]+(busy?', 내 일정 있음':'')+(level?', 내 선택: '+LEVEL_TEXT[level]:'')+', '+count+'/'+total+'명 가능';
}
function applyCalendarHeat(button,count,total){
  button.style.setProperty('--vote-bg',calendarHeatColor(count,total));
  button.dataset.votes=String(count);button.dataset.voteTotal=String(total);
  const label=calendarVoteLabel(button.dataset.d,button.dataset.s,Number(button.dataset.l)||0,count,total,button.classList.contains('busy'));
  button.title=label;button.setAttribute('aria-label',label);
}

function renderCalendar(){
  detachVoteDrag?.();detachVoteDrag=null;
  const today=todayStr(),mv=myVotes(),idx=calDays(),heat=calendarVoteHeat();
  const html=monthsBetween(S.meta.start,S.meta.end).map(ym=>{
    const [y,m]=ym.split('-').map(Number);
    const first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();
    const cells=Array(first).fill({h:'<div></div>',past:true});
    for(let d=1;d<=days;d++){
      const ds=`${ym}-${pad(d)}`,dow=(first+d-1)%7,past=ds<today;
      if(!inMeetingRange(ds)){cells.push({h:'<div aria-hidden="true"></div>',past:true});continue}
      const holiday=holidayName(ds);
      const dayEv=past?[]:(idx[ds]||[]);
      const halves=SLOTS.map(([sl,name])=>{
        const l=past?0:lvOf(mv,ds,sl),r=(hash(ds+sl)%9)-4,busy=dayEv.some(e=>e[sl]),count=heat.counts[ds+'|'+sl]||0;
        const voteLabel=calendarVoteLabel(ds,sl,l,count,heat.total,busy);
        return `<button class="half${busy?' busy':''}" data-d="${ds}" data-s="${sl}" aria-keyshortcuts="Shift+Enter Shift+Space" data-l="${l}" data-votes="${count}" data-vote-total="${heat.total}" style="--vote-bg:${calendarHeatColor(count,heat.total)}" ${past?'disabled':''}
          title="${esc(voteLabel)}" aria-label="${esc(voteLabel)}"><i class="stk" style="--r:${r}deg" aria-hidden="true">${meetingSticker()}</i><span class="lb">${name}</span></button>`}).join('');
      cells.push({past,ds,dow,m,d,h:`<div title="${esc(holiday)}" class="day${holiday?' holiday':''}${dow===0?' sun':''}${dow===6?' sat':''}${ds===today?' today':''}${past?' past':''}"><span class="n">${d}</span>${calendarDayHtml(ds,dayEv)}${halves}</div>`});
    }
    let rows='';
    for(let i=0;i<cells.length;i+=7){const wk=cells.slice(i,i+7);if(wk.every(c=>c.past))continue;rows+=wk.map(c=>c.h).join('')}
    if(!rows)return '';
    return `<section class="month"><h2>${y===new Date().getFullYear()?'':y+'년 '}${m}월</h2>
      <div class="wk">${WD.map(w=>`<div>${w}</div>`).join('')}</div><div class="grid" style="row-gap:6px">${rows}</div></section>`;
  }).join('');
  $('#body').innerHTML=`
    <div class="calbar" id="calbar">${calBarHtml()}</div>
    <button type="button" class="btn block" id="reuseVotes" style="margin-bottom:16px;background:var(--paper);color:var(--s1);border:1.5px solid var(--line)">다른 투표에서 가져오기</button>
    <div class="legend">
      <span><i class="legend-sticker l2" aria-hidden="true">${meetingSticker(2)}</i>한 번 클릭: 아마 가능</span>
      <span><i class="legend-sticker l3" aria-hidden="true">${meetingSticker(3)}</i>두 번 클릭: 되긴 하는데…</span>
      <span><i class="legend-sticker l4" aria-hidden="true">${meetingSticker(4)}</i>길게 누르기: 어떻게 해도 불가능</span>
    </div>
    <p class="vote-save-status" data-vote-save-status role="status" aria-live="polite"></p>
    <button type="button" class="btn ghost" id="retryVoteSave" hidden>다시 저장하기</button>
    ${html}
    <button class="btn ghost clear" id="clearAll">내 스티커 모두 떼기</button>`;
  $('#body').onclick=onDayTap;
  detachVoteDrag=window.attachVoteDrag($('#body'),(b,l,method)=>setVoteLevel(b,l,method||'drag'),nextVoteLevel);
  $('#reuseVotes').onclick=()=>offerVoteImport(true);
  $('#retryVoteSave').onclick=retryVoteSaves;
  renderVoteSaveState();

function onDayTap(e){
  const agenda=e.target.closest('[data-agenda]');if(agenda)return openCalendarDay(agenda.dataset.agenda);
  const w=e.target.closest('.wkplan');
  if(w){const d=w.nextElementSibling;d.hidden=!d.hidden;w.setAttribute('aria-expanded',String(!d.hidden));return}
  const act=e.target.closest('[data-cal]')?.dataset.cal;
  if(act==='open')return openCalSheet();
  if(e.target.id==='clearAll'){
    if(!Object.keys(myVotes()).length){toast('붙인 스티커가 없어요');return}
    const state=voteSaves.info(voteSaveKey());if(state.pending||state.failed)return;
    if(confirm('내가 붙인 스티커를 모두 뗄까요?')){
      const path=`sessions/${sid}/votes/${S.me}`;
      void voteSaves.save(voteSaveKey(),path,()=>store.set(path,null),{root:true}).then(r=>{if(r.ok)usage('vote_clear')});
    }

  }
  const b=e.target.closest('.half');if(!b||b.disabled)return;
  setVoteLevel(b,nextVoteLevel(b.dataset.l));
}
function setVoteLevel(b,next,inputMethod='tap'){
  if(!b||b.disabled||!S.me||!inMeetingRange(b.dataset.d))return;
  if(voteSaves.info(voteSaveKey()).rootBlocked)return;
  if(Number(b.dataset.l)===next)return;
  const d=b.dataset.d,sl=b.dataset.s;
  b.dataset.l=next;
  const mv={...myVotes()};const day={...(typeof mv[d]==='object'&&mv[d]?mv[d]:{})};
  if(next)day[sl]=next;else delete day[sl];
  if(Object.keys(day).length)mv[d]=day;else delete mv[d];
  S.votes={...S.votes,[S.me]:mv};
  const count=Object.keys(S.members||{}).filter(id=>[2,3].includes(normalizeVoteLevel(S.votes?.[id]?.[d]?.[sl]))).length;
  applyCalendarHeat(b,count,calendarVoteTotal());
  navigator.vibrate?.(8);
  const path=`sessions/${sid}/votes/${S.me}/${d}/${sl}`;
  void voteSaves.save(voteSaveKey(),path,()=>store.set(path,next||null)).then(r=>{if(r.ok)usage('vote_change',{input_method:inputMethod,selection:next===2?'normal':next===3?'uncertain':next===4?'unavailable':'remove'})});
}
function syncCalendar(){
  if(!$('.month'))return;
  const mv=myVotes(),heat=calendarVoteHeat();
  document.querySelectorAll('.half:not(:disabled)').forEach(b=>{
    const l=String(lvOf(mv,b.dataset.d,b.dataset.s));if(b.dataset.l!==l)b.dataset.l=l;
    applyCalendarHeat(b,heat.counts[b.dataset.d+'|'+b.dataset.s]||0,heat.total);
  });
}

  const t=todayStr();let n=0;
  for(const[d,v] of Object.entries(S.votes?.[id]||{}))if(d>=t&&inMeetingRange(d)&&v&&typeof v==='object')n+=['L','D'].filter(slot=>normalizeVoteLevel(v[slot])>0).length;
  return n;
}

function computeRank(data=S){
  const ids=Object.keys(data.members||{}),today=todayStr(),map={};
  for(const id of ids){
    for(const [d,v] of Object.entries(data.votes?.[id]||{})){
      if(!v||typeof v!=='object'||d<today||!inMeetingRange(d,data.meta))continue;
      for(const [sl,storedLevel] of Object.entries(v)){
        const l=normalizeVoteLevel(storedLevel);
        if(!SLOT_NAME[sl]||!l)continue;
        const r=map[d+sl]??={d,sl,count:0,unavailable:0,score:0,lv:{}};
        if(l===4){r.unavailable++;r.score-=2}else{r.count++;r.score+=4-l}r.lv[id]=l;
      }
    }
  }
  return {ids,list:Object.values(map).filter(r=>r.count>0).sort((a,b)=>a.unavailable-b.unavailable||b.count-a.count||b.score-a.score||a.d.localeCompare(b.d)||['L','D'].indexOf(a.sl)-['L','D'].indexOf(b.sl))};
}

      return `<li class="rk${isAll?' all':''}">
        <div class="pos">${i+1}</div>
        <div><div class="rdate">${dt.getMonth()+1}월 ${dt.getDate()}일<small class="${dow===0||holidayName(r.d)?'sun':dow===6?'sat':''}" title="${esc(holidayName(r.d))}">${WD[dow]}</small><span class="slot ${r.sl}">${SLOT_NAME[r.sl]}</span></div>
          <div class="bar">${segs}</div>${notes?`<div class="missing">${notes}</div>`:''}</div>
        <div>${isAll?`<span class="allstk">${expected?'다 되는<br>시간!':'현재 참여자<br>모두 가능'}</span>`:`<div class="cnt">${r.count}<small>/${total}명</small></div>`}</div>
      </li>`}).join('')}</ol>
      ${list.length>10?`<button class="btn ghost more" id="more">${S.showAll?'상위 10개만 보기':`전체 ${list.length}개 보기`}</button>`:''}`
    :`<div class="empty">‘스티커 붙이기’에서 되는 점심·저녁 칸을 눌러 보세요.<br>친구들이 붙이는 대로 여기 순위가 바로 바뀌어요.</div>`}
    <p class="hint" style="text-align:center;margin-top:14px">불가능한 사람이 적은 순, 가능한 사람이 많은 순, 합계 점수가 높은 순이에요. 아마 가능 2점 · 되긴 하는데… 1점 · 불가능 -2점. 미응답은 불가능으로 세지 않아요.</p>`;
  const more=$('#more');if(more)more.onclick=()=>{S.showAll=!S.showAll;renderRank()};
}

/* ---------- 시작 ---------- */
(async()=>{
  const publicUrl=new URL(PUBLIC_SITE_URL);
  const query=new URLSearchParams(location.search);
  if(location.origin!==publicUrl.origin&&!query.has('code')&&!query.has('error')){
    publicUrl.search=location.search;publicUrl.hash=location.hash;
    location.replace(publicUrl.href);return;
  }
  const immediateHome=!sid&&!query.has('code')&&!query.has('error')&&!query.has('admin');
  const initialRoute=sessionLoad;
  // The creation form needs no account data. Render it once, before network work.
  if(immediateHome)viewCreate();else showPageLoading();
  sessionReady=(async()=>{await restoreKakaoSession();await completeKakaoLogin()})();
  await sessionReady;
  if(initialRoute!==sessionLoad)return;
  if(resumeAdmin||new URLSearchParams(location.search).get('admin')==='1'){if(kakaoUser)location.replace('/admin.html');else loginKakao('admin');return}
  if(immediateHome){
    // Do not replace inputs, scroll position, or keyboard focus after login restores.
    if(!sid&&$('#homeLogo'))bindAdminLogo();
  }else if(sid)bootSession();
  else viewCreate();
  if(resumeMeetings&&kakaoUser){resumeMeetings=false;await openMyMeetings()}
})();
window.addEventListener('popstate',async()=>{
  closeMeetingPeriod();
  sid=new URLSearchParams(location.search).get('s');
  const target=sid,request=++sessionLoad;
  (S.unsub||[]).forEach(f=>f());S.unsub=[];shown=null;
  closeCalSheet();closeVoteImport();
  if(target){
    showPageLoading('투표를 불러오는 중…');
    await sessionReady;
    if(request===sessionLoad&&sid===target)bootSession();
  }else viewCreate();
});
</script>
